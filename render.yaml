services:
  # Laravel Backend API Service
  - type: web
    name: food-system-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    envVars:
      - key: APP_NAME
        value: "SreyKeo Coffee & Soup"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: food-system-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: food-system-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: food-system-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: food-system-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: food-system-db
          property: password
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: cookie
      - key: CACHE_STORE
        value: file
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
      - key: APP_KEY
        value: "base64:w4JoZ1uAw3ec9Hc+U/5ZkyEREm5LgNeF4GzmTJnNYQY="
      - key: APP_URL
        value: "https://food-system-backend-uroh.onrender.com"
      - key: FRONTEND_URL
        value: "https://food-system-sk.vercel.app"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

databases:
  # Free Managed PostgreSQL Database on Render
  - name: food-system-db
    plan: free
    region: singapore
    databaseName: food_system
